<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Smart Saline: how it works</title>
<desc id="desc">Each bedside unit has an IR drop sensor, a load cell and a pulse sensor connected to an Arduino Uno, which also drives a servo that squeezes the IV tube and an OLED display with a buzzer. The Arduino talks over NRF24L01 2.4 GHz radio, without internet, to a Raspberry Pi at the nurses' desk. The Pi runs a Flask web app backed by MySQL, and doctors and nurses use the web dashboard to monitor patients and send Start, Stop and rate commands back to the bed.</desc>
