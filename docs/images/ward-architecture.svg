<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Ward architecture</title>
<desc id="d">Up to four bedside units in a ward, each with a load cell, IR drop sensor, servo squeezer, Arduino and OLED display, talk over offline NRF24L01 radio to a central station: a Raspberry Pi main receiver running the Flask web app. The data goes to a MySQL database, a Raspberry Pi touch display at the nurses' station, and a web portal on PCs or phones on the ward network. Staff respond to dashboard alerts: the doctor gives input, an admin allocates staff, and a nurse attends the bed or the rate is changed remotely.</desc>
