<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="t d">
<title id="t">Hardware block diagram</title>
<desc id="d">Patient side: a load cell, an IR sensor, a MAX30102 pulse sensor and an MLX90614 temperature sensor feed an Arduino Uno, which has its own power supply, drives a servo motor and a buzzer, and sends data through an NRF transceiver. Over 2.4 GHz radio, a second NRF transceiver passes the data to a Raspberry Pi with its own power supply, a buzzer and a display.</desc>
