<div class="modal fade" id="securityModal" tabindex="-1" role="dialog" aria-labelledby="securityModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body text-center">
        <h2 class="h4" id="securityModalTitle">Enter security code</h2>
        <p class="text-muted small">Required to save patient and therapy changes.</p>
        <form class="form-inline justify-content-center" onsubmit="submitWithSecurityCode(); return false;">
          <input id="securityCodeInput" class="form-control form-control-lg mr-sm-2" type="password"
                 placeholder="Security code" autocomplete="off" aria-label="Security code">
          <button class="btn btn-primary btn-lg my-2 my-sm-0" type="submit">Confirm</button>
        </form>
        <div id="messageContainer" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>
