<div class="modal fade" id="ivFormModal" tabindex="-1" role="dialog" aria-labelledby="ivFormTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h2 class="h4 text-center" id="ivFormTitle">New IV therapy</h2>
        <p class="text-center text-muted">Patient ID {{ patient.RegID }}</p>

        <form id="ivForm" action="{{ url_for('submit_iv_details') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="security_code" class="security-code-field">
          <input type="hidden" name="RegID" value="{{ patient.RegID }}">

          <div class="form-group">
            <label for="iv_type">IV type</label>
            <input type="text" id="iv_type" name="iv_type" class="form-control" maxlength="255" required>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="bp">Systolic BP (mmHg)</label>
              <input type="number" id="bp" name="bp" class="form-control" min="40" max="300" required>
            </div>
            <div class="form-group col-md-4">
              <label for="sugar">Blood sugar (mg/dL)</label>
              <input type="number" id="sugar" name="sugar" class="form-control" min="10" max="1000" required>
            </div>
            <div class="form-group col-md-4">
              <label for="pulse">Pulse (bpm)</label>
              <input type="number" id="pulse" name="pulse" class="form-control" min="20" max="250" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="size">Bottle volume (mL)</label>
              <input type="number" id="size" name="size" class="form-control" min="1" max="2550" required>
            </div>
            <div class="form-group col-md-6">
              <label for="drop_factor">Drop factor (drops/mL)</label>
              <input type="number" id="drop_factor" name="drop_factor" class="form-control" min="1" max="255" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="infuTime">Infusion time (minutes)</label>
              <input type="number" id="infuTime" name="infuTime" class="form-control" min="1" required>
            </div>
            <div class="form-group col-md-6">
              <label for="channel">Channel</label>
              <select id="channel" name="channel" class="form-control" required>
                <option value="" selected disabled hidden>Select a channel</option>
                <option value="1">Channel 1</option>
                <option value="2">Channel 2</option>
                <option value="3">Channel 3</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="addinfo">Additional instructions (optional)</label>
            <input type="text" id="addinfo" name="addinfo" class="form-control" maxlength="255">
          </div>
          <p class="small text-muted">Drop rate = volume × drop factor ÷ minutes. The device accepts 1–255 drops/min.</p>
          <div class="text-center">
            <button class="btn btn-primary" type="button" onclick="startTherapy()">Save therapy</button>
          </div>
        </form>
        <div id="ivMessage" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>
